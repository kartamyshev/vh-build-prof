<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Builders — Строительство и ремонт под ключ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- HEADER -->
<header>
  <div class="container">
    <nav class="nav">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 12L12 4l9 8v8H3v-8z"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="brand">NORTH BUILDERS</div>
          <div class="tag">Строительство и ремонт</div>
        </div>
      </div>
      <nav-bar></nav-bar>
      
      <a href="#contact" class="btn btn-primary">Получить смету</a>
    </nav>
  </div>
</header>

<hero-block></hero-block>
<our-projects></our-projects>
<our-services></our-services>
<our-prices></our-prices>
<why-us></why-us>
<our-testimonials></our-testimonials>
<contact-form></contact-form>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 12L12 4l9 8v8H3v-8z"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="brand">NORTH BUILDERS</div>
          <div class="tag">Строительство и ремонт</div>
        </div>
      </div>
      <footer-menu></footer-menu>
      <div class="footer-copy">
        © 2026 North Builders<br>
        Все права защищены
      </div>
    </div>
  </div>
</footer>

<script>
  // Tab switcher
  document.querySelectorAll('.tabs a').forEach(tab => {
    tab.addEventListener('click', e => {
      document.querySelectorAll('.tabs a').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
    });
  });
</script>
<script src="./index.js"></script>
</body>
</html>
